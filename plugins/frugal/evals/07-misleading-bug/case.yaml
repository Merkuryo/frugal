schema_version: "1.0"
name: 07-misleading-bug
description: Symptom shows in one file, cause lives in another; a symptom patch is the tempting wrong fix.
tags: [multistep]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Customers report that their EUR and GBP invoice totals are about 100 times too high; USD invoices are fine.
    The code is in `billing/` and the exchange rates in `data/rates.csv`. Run `python3 -m billing.invoice` to see totals.
    Find the cause and fix it.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Read, Write, Edit, Bash, Glob, Grep]
runs: 3
graders:
  - name: root-cause-fixed
    type: llm
    focus: {source: file, path: billing/rates.py}
    criteria: "load_rates no longer multiplies non-USD rates by 100: every currency's rate is used as written in the CSV."
  - name: no-symptom-patch
    type: llm
    focus: {source: file, path: billing/invoice.py}
    criteria: "invoice.py does not divide by 100 or add any per-currency correction; it still simply multiplies the USD sum by the loaded rate."
  - name: reproduced
    type: regex
    target: trace
    pattern: "billing.invoice"
  - name: explains-cause
    type: llm
    criteria: "The final message says the cause was in the rate loader (rates.py) multiplying non-USD rates by 100, and shows corrected totals (EUR 92.0 and GBP 79.0 for the sample order)."
  - name: router-fired
    type: tool_used
    tool: Skill
    input_match: frugal
    arm: with-only
